<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Descripter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    h1 { font-size: 1.6rem; margin-bottom: 0.4rem; color: #f8fafc; }
    p.sub { color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem; }
    .card {
      width: 100%;
      max-width: 640px;
      background: #1e293b;
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid #334155;
    }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.5rem; }
    .drop {
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 1.2rem;
    }
    .drop:hover, .drop.dragover { border-color: #38bdf8; background: #0f172a; }
    .drop img {
      max-width: 100%;
      max-height: 260px;
      border-radius: 8px;
      display: none;
      margin-top: 0.8rem;
    }
    textarea {
      width: 100%;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 0.95rem;
      resize: vertical;
      min-height: 90px;
      font-family: inherit;
    }
    select {
      width: 100%;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
    }
    textarea:focus, input:focus, select:focus { outline: 2px solid #38bdf8; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 1.2rem;
      padding: 0.85rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .controls { margin-top: 1.6rem; border-top: 1px solid #334155; padding-top: 1rem; }
    .controls h3 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.6rem; font-weight: 600; }
    .btn-row { display: flex; gap: 0.6rem; }
    .btn-row button {
      flex: 1;
      margin-top: 0;
      padding: 0.6rem 0.4rem;
      font-size: 0.85rem;
      font-weight: 500;
      background: #334155;
    }
    .btn-row button:hover:not(:disabled) { background: #475569; }
    .btn-row button.danger { background: #7f1d1d; }
    .btn-row button.danger:hover:not(:disabled) { background: #991b1b; }
    .ctrl-status { margin-top: 0.7rem; font-size: 0.82rem; color: #94a3b8; min-height: 1em; }
    .chat { display: none; margin-top: 1.2rem; }
    .chat-history {
      max-height: 400px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 0.2rem;
    }
    .bubble {
      max-width: 88%;
      padding: 0.7rem 0.9rem;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 0.92rem;
      word-break: break-word;
    }
    .bubble.user { align-self: flex-end; background: #0284c7; color: white; border-bottom-right-radius: 4px; }
    .bubble.assistant { align-self: flex-start; background: #334155; color: #e2e8f0; border-bottom-left-radius: 4px; }
    .bubble.error { align-self: flex-start; background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
    .bubble.typing { align-self: flex-start; color: #94a3b8; font-style: italic; }
    .chat-input-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
    .chat-input-row input {
      flex: 1;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.7rem 0.8rem;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .chat-input-row input:focus { outline: 2px solid #38bdf8; border-color: transparent; }
    .chat-input-row button {
      margin-top: 0;
      padding: 0.7rem 1rem;
      width: auto;
      font-size: 0.9rem;
      flex-shrink: 0;
    }
    .chat-input-row button.secondary { background: #334155; }
    .chat-input-row button.secondary:hover:not(:disabled) { background: #475569; }
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.loading .spinner { display: inline-block; }
    button.loading span.label { display: none; }
  </style>
</head>
<body>
  <h1>Image Descripter</h1>
  <p class="sub">Sube una imagen (opcional) y conversa con el modelo, o pide una descripción.</p>

  <div class="card">
    <form id="form">
      <label for="file">Imagen (opcional)</label>
      <div class="drop" id="drop">
        <input type="file" id="file" accept="image/*" style="display:none">
        <div id="drop-text">Haz clic o arrastra una imagen aquí (opcional)</div>
        <img id="preview" alt="Vista previa">
      </div>

      <label for="context">Mensaje inicial / contexto (opcional)</label>
      <textarea id="context" name="context" placeholder="Ej: Describe este producto para una tienda online, destacando sus colores y qué sensación transmite."></textarea>

      <label for="model">Modelo</label>
      <select id="model" name="model">
        <option value="qwen2.5vl:3b">qwen2.5vl:3b (mejor calidad)</option>
        <option value="gemma3:4b">gemma3:4b (ligero)</option>
      </select>

      <button type="submit" id="btn">
        <span class="spinner"></span>
        <span class="label">Iniciar chat</span>
      </button>
    </form>

    <div class="chat" id="chat">
      <div class="chat-history" id="chat-history"></div>
      <div class="chat-input-row">
        <input type="text" id="chat-input" placeholder="Escribe tu mensaje…">
        <button type="button" id="btn-send">
          <span class="spinner"></span>
          <span class="label">Enviar</span>
        </button>
        <button type="button" id="btn-newchat" class="secondary">Nuevo chat</button>
      </div>
    </div>

    <div class="controls">
      <h3>Controles del servidor</h3>
      <div class="btn-row">
        <button type="button" id="btn-reload">Recargar modelo</button>
        <button type="button" id="btn-restart">Reiniciar servidor</button>
        <button type="button" id="btn-stop" class="danger">Detener procesos</button>
      </div>
      <div class="ctrl-status" id="ctrl-status"></div>
    </div>
  </div>

  <script>
    const drop = document.getElementById('drop');
    const fileInput = document.getElementById('file');
    const preview = document.getElementById('preview');
    const dropText = document.getElementById('drop-text');
    const form = document.getElementById('form');
    const btn = document.getElementById('btn');
    const chatEl = document.getElementById('chat');
    const chatHistory = document.getElementById('chat-history');
    const chatInput = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    const btnNewChat = document.getElementById('btn-newchat');

    let messages = [];
    let imageB64 = '';

    drop.addEventListener('click', () => fileInput.click());
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('dragover'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('dragover');
      if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) setFile(fileInput.files[0]);
    });

    function setFile(file) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        imageB64 = (reader.result.split(',')[1] || '');
        preview.src = reader.result;
        preview.style.display = 'block';
        dropText.textContent = file.name;
      };
      reader.readAsDataURL(file);
    }

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'bubble ' + role;
      div.textContent = text;
      chatHistory.appendChild(div);
      chatHistory.scrollTop = chatHistory.scrollHeight;
      return div;
    }

    function setBusy(busy) {
      btn.disabled = busy;
      btnSend.disabled = busy;
      btnNewChat.disabled = busy;
      chatInput.disabled = busy;
      btn.classList.toggle('loading', busy);
      btnSend.classList.toggle('loading', busy);
      chatInput.focus();
    }

    async function sendTurn(history, model, image, isFirst) {
      const fd = new FormData();
      fd.append('model', model);
      fd.append('messages', JSON.stringify(history));
      if (image) fd.append('image', image);

      setBusy(true);
      if (isFirst) {
        form.style.display = 'none';
        chatEl.style.display = 'block';
      }
      addBubble('user', history[history.length - 1].content);
      const typing = addBubble('typing', 'Pensando…');

      try {
        const res = await fetch('/api/chat', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error del servidor');
        typing.remove();
        addBubble('assistant', data.reply);
        messages = [...history, { role: 'assistant', content: data.reply }];
      } catch (err) {
        typing.remove();
        addBubble('error', 'Error: ' + err.message);
      } finally {
        setBusy(false);
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const context = document.getElementById('context').value.trim();
      const firstContent = context || 'Describe esta imagen en detalle.';
      sendTurn([{ role: 'user', content: firstContent }], document.getElementById('model').value, imageB64, true);
    });

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      chatInput.value = '';
      const nextHistory = [...messages, { role: 'user', content: text }];
      sendTurn(nextHistory, document.getElementById('model').value, imageB64, false);
    }

    btnSend.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    btnNewChat.addEventListener('click', () => {
      if (messages.length && !confirm('¿Iniciar un nuevo chat? Se borrará la conversación actual.')) return;
      messages = [];
      chatHistory.innerHTML = '';
      chatEl.style.display = 'none';
      form.style.display = '';
      document.getElementById('context').value = '';
      chatInput.value = '';
    });

    // --- Controles del servidor ---
    const ctrlStatus = document.getElementById('ctrl-status');

    function ctrlMsg(text, isError) {
      ctrlStatus.textContent = text;
      ctrlStatus.style.color = isError ? '#fca5a5' : '#94a3b8';
    }

    async function postCtrl(url, body) {
      const res = await fetch(url, { method: 'POST', body });
      return res.json();
    }

    document.getElementById('btn-reload').addEventListener('click', async () => {
      const model = document.getElementById('model').value;
      ctrlMsg('Pre-cargando ' + model + '…');
      try {
        const fd = new FormData();
        fd.append('model', model);
        const data = await postCtrl('/api/reload-model', fd);
        ctrlMsg(data.ok ? data.message : ('Error: ' + (data.error || 'desconocido')), !data.ok);
      } catch (err) {
        ctrlMsg('Error: ' + err.message, true);
      }
    });

    document.getElementById('btn-restart').addEventListener('click', async () => {
      if (!confirm('¿Reiniciar el servidor? La página se recargará en unos segundos.')) return;
      ctrlMsg('Reiniciando el servidor…');
      try {
        await postCtrl('/api/restart');
        setTimeout(() => { location.reload(); }, 4500);
      } catch (err) {
        ctrlMsg('Error: ' + err.message, true);
      }
    });

    document.getElementById('btn-stop').addEventListener('click', async () => {
      if (!confirm('¿Detener la app? Ollama seguirá corriendo. Para volver a usarla, relánzala con run.sh / start_windows.bat.')) return;
      ctrlMsg('Deteniendo la app…');
      try {
        await postCtrl('/api/stop');
        ctrlMsg('App detenida. Relanza con run.sh / start_windows.bat para volver a usarla.');
      } catch (err) {
        ctrlMsg('Error: ' + err.message, true);
      }
    });
  </script>
</body>
</html>
